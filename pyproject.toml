[project]
name = "llm-from-first-principles"
version = "0.1.0"
description = "Implementacao de um LLM moderno a partir dos primeiros principios"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
